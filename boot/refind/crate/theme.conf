# Crate for Ryoku: rEFInd in the look of Ryoku's reload cover under Crate.
# Included by the refind.conf that `crate-for-ryoku boot apply` writes; paths are
# relative to rEFInd's folder on the ESP (EFI/refind).
banner themes/crate/banner.png
banner_scale fillscreen
selection_big themes/crate/selection_big.png
selection_small themes/crate/selection_small.png
font themes/crate/font.png
icons_dir themes/crate/icons
big_icon_size 128
small_icon_size 48
hideui hints,arrows,badges
showtools shutdown,reboot,firmware
use_graphics_for windows,grub
